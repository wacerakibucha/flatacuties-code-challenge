<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flatacuties</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Flatacuties </h1>
  <div class="container">
    <aside>
      <h2>Animal List</h2>
      <ul id="animal-list"></ul>
    </aside>

    <main>
      <h2 id="animal-name">Select an Animal</h2>
      <img id="animal-image" src="" alt="Animal" />
      <p>Votes: <span id="animal-votes">0</span></p>
      <button id="vote-btn">Vote</button>
      <button id="reset-btn">Reset Votes</button>
    </main>
  </div>

  <script src="script.js"></script>
<!-- Add new animal form -->
  <section>
    <h2>Add a New Animal</h2>
    <form id="animal-form">
      <input type="text" id="name" placeholder="Animal Name" required>
      <input type="text" id="image" placeholder="Image URL" required>
      <button type="submit">Add Animal</button>
    </form>
  </section>
</body>
</html>
